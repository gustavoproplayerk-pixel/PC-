name: Windows Cloud PC - AnyDesk (Instalação Automática)

on:
  workflow_dispatch:
    inputs:
      anydesk_id:
        description: 'Seu ID AnyDesk Fixo (deixe vazio para gerar aleatório)'
        required: false
        default: ''

jobs:
  build:
    name: Sistema Reforçado (Daemon + Monitoramento)
    runs-on: windows-latest
    
    env:
      ANYDESK_DIR: "C:\\Program Files (x86)\\AnyDesk"
      ANYDESK_EXE: "C:\\Program Files (x86)\\AnyDesk\\AnyDesk.exe"
      ANYDESK_INSTALLER: "C:\\Temp\\AnyDesk_Setup.exe"

    steps:
      - name: 🚀 Otimização do Ambiente
        run: |
          powercfg /setactive 8a18e390-3e07-416b-b74f-a028c23a9d0a
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          Write-Host "Ambiente otimizado."

      - name: ⬇️ Baixar AnyDesk
        run: |
          # URL oficial do instalador de 32 bits (geralmente mais leve para servidores)
          $url = "https://download.anydesk.com/AnyDesk_32bit.exe"
          Write-Host "Baixando AnyDesk..."
          Invoke-WebRequest -Uri $url -OutFile "${{ env.ANYDESK_INSTALLER }}"
          if (Test-Path "${{ env.ANYDESK_INSTALLER }}") {
              Write-Host "Download concluído."
          } else {
              Exit 1
          }

      - name: ⚙️ Instalar AnyDesk Silenciosamente
        run: |
          $installer = "${{ env.ANYDESK_INSTALLER }}"
          $dir = "${{ env.ANYDESK_DIR }}"
          
          Write-Host "Instalando AnyDesk..."
          Start-Process $installer -ArgumentList "/SILENT", "/NORESTART", "/D=$dir" -Wait
          
          # Limpa o instalador
          Remove-Item $installer -Force -ErrorAction SilentlyContinue
          
          if (-not (Test-Path "${{ env.ANYDESK_EXE }}")) {
              Write-Error "❌ Instalação falhou: Executável não encontrado."
              exit 1
          }
          Write-Host "✅ AnyDesk instalado com sucesso."

      - name: ⚡ Preparar e Iniciar Daemon
        run: |
          $anydeskExe = "${{ env.ANYDESK_EXE }}"
          $dir = "${{ env.ANYDESK_DIR }}"
          
          # Limpa processos antigos caso tenha restado algo
          Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue | Stop-Process -Force
          
          # Define ID Fixo se fornecido
          if ("${{ github.event.inputs.anydesk_id }}" -ne "") {
              Write-Host "Definindo ID Fixo: ${{ github.event.inputs.anydesk_id }}"
              Set-Content -Path "$dir\user.conf" -Value "id=${{ github.event.inputs.anydesk_id }}" -Encoding ascii
          } else {
              Write-Host "Gerando ID Aleatório..."
              # Garante que user.conf não exista para forçar geração nova
              if (Test-Path "$dir\user.conf") {
                  Remove-Item "$dir\user.conf" -Force
              }
          }

          # INICIA O DAEMON
          Start-Process $anydeskExe -ArgumentList "--daemon", "--minimized" -WindowStyle Hidden -WorkingDirectory $dir
          
          Write-Host "Aguardando inicialização..."
          Start-Sleep -Seconds 25

      - name: 🔍 Verificar Status
        run: |
          $pid = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
          
          if ($pid) {
              Write-Host "✅ AnyDesk Daemon está RODANDO (PID: $($pid.Id))"
              
              $configFile = "${{ env.ANYDESK_DIR }}\user.conf"
              $retrievedId = ""
              
              if (Test-Path $configFile) {
                  $content = Get-Content $configFile -Raw
                  if ($content -match "id=(.+)") {
                      $retrievedId = $matches[1]
                  }
              }

              # Tenta pegar ID gerado automaticamente se não foi fixado
              if ("${{ github.event.inputs.anydesk_id }}" -eq "" -and $retrievedId -eq "") {
                  Start-Sleep -Seconds 5
                  if (Test-Path $configFile) {
                       $newContent = Get-Content $configFile -Raw
                       if ($newContent -match "id=(.+)") {
                           $retrievedId = $matches[1]
                       }
                  }
              }

              if ($retrievedId -ne "") {
                  Write-Host "🆔 Seu AnyDesk ID é: $retrievedId"
              } else {
                  Write-Host "⚠️ ID não encontrado ainda."
              }
          } else {
              Write-Host "❌ ERRO: Processo não iniciou."
              exit 1
          }

      - name: 🛡️ Monitoramento Contínuo (7 Dias)
        run: |
          Write-Host "=== MONITORAMENTO ATIVO (Alvo: 7 Dias) ==="
          $maxLoops = 60480 
          $loopCount = 0
          
          while ($loopCount -lt $maxLoops) {
              $loopCount++
              $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              $portOpen = $false
              
              if (-not $process -or $process.HasExited) {
                  Write-Host "⚠️ [Loop $loopCount/$maxLoops] Processo não encontrado. Reiniciando..."
                  Start-Sleep -Seconds 5
                  Start-Process "${{ env.ANYDESK_EXE }}" -ArgumentList "--daemon", "--minimized" -WindowStyle Hidden -WorkingDirectory "${{ env.ANYDESK_DIR }}"
                  Start-Sleep -Seconds 10
                  continue
              }

              try {
                  $tcpClient = New-Object System.Net.Sockets.TcpClient
                  $connect = $tcpClient.BeginConnect("127.0.0.1", 7070, $null, $null)
                  $timeout = $connect.AsyncWaitHandle.WaitOne(2000, $false)
                  if ($timeout) {
                      $portOpen = $true
                      $tcpClient.Close()
                  }
              } catch {}

              if (-not $portOpen) {
                  Write-Host "⚠️ [Loop $loopCount/$maxLoops] Porta 7070 fechada. Reiniciando serviço..."
                  Stop-Process -Name "AnyDesk" -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 5
                  Start-Process "${{ env.ANYDESK_EXE }}" -ArgumentList "--daemon", "--minimized" -WindowStyle Hidden -WorkingDirectory "${{ env.ANYDESK_DIR }}"
                  Start-Sleep -Seconds 10
              } else {
                  if ($loopCount % 360 -eq 0) {
                      Write-Host "✅ [Loop $loopCount/$maxLoops] AnyDesk está saudável (1h passada)."
                  }
                  Start-Sleep -Seconds 10
              }
          }
          
          Write-Host "=== FIM DO MONITORAMENTO (7 Dias concluídos) ==="
