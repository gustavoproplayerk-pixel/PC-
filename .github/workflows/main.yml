name: Setup Roblox RDP + Tailscale (Infinito)

on:
  workflow_dispatch: # Execute manualmente via botão na aba Actions

jobs:
  setup-roblox-rdp:
    runs-on: windows-latest
    
    timeout-minutes: 0 
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Tailscale Service is Running
        run: |
          Write-Host "Garantindo que o serviço Tailscale está ativo..."
          Start-Service tailscaled
          Write-Host "Serviço Tailscale iniciado."

      - name: Authenticate Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ($env:TAILSCALE_AUTH_KEY) {
            Write-Host "Autenticando com chave..."
            # --reset limpa configurações antigas para evitar conflitos
            tailscale up --authkey=$env:TAILSCALE_AUTH_KEY --hostname="roblox-rdp-${{ github.run_number }}" --reset
          } else {
            Write-Host "Chave não encontrada. Iniciando modo manual..."
            tailscale up --advertise-tags=tag:ci-runner
          }

      - name: Wait for Connection to Stabilize
        shell: pwsh
        run: |
          Write-Host "Aguardando conexão Tailscale ficar saudável..."
          $maxAttempts = 60 # Espera até 5 minutos
          $attempt = 0
          
          while ($attempt -lt $maxAttempts) {
              try {
                  # Verifica o status via API local do Tailscale
                  $status = Invoke-RestMethod -Uri "http://100.100.100.100/v3/status" -ErrorAction Stop
                  
                  if ($status.Self.Status -eq "Running") {
                      Write-Host "Conexão estabelecida!"
                      break
                  }
              } catch {
                  Write-Host "Aguardando conexão... (Tentativa $($attempt + 1))"
              }
              
              Start-Sleep -Seconds 5
              $attempt++
          }

      - name: Configure Remote Desktop & Power
        shell: pwsh
        run: |
          Write-Host "Configurando RDP e Energia..."
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Habilita Ultimate Performance se não existir
          powercfg /list | Select-String "Ultimate Performance" -Quiet | Out-Null
          if (-not $?) {
              powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb99
          }
          
          # Ativa perfil de alta performance
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /hibernate off
          
          Write-Host "RDP e Energia configurados."

      - name: Get IP via Local API
        id: get-ip
        shell: pwsh
        run: |
          Write-Host "Obtendo IP via API local do Tailscale..."
          try {
              $ip = Invoke-RestMethod -Uri "http://100.100.100.100/v3/ip" -ErrorAction Stop
              echo "IP_TAILNET=$ip" >> $env:GITHUB_ENV
              Write-Host "::set-output name=ip::$ip"
              Write-Host "IP Obtido: $ip"
          } catch {
              Write-Error "Falha ao obter IP pela API local."
              exit 1
          }

      - name: Display Connection Info
        run: |
          echo "=========================================="
          echo "CONFIGURAÇÃO CONCLUÍDA - MODO INFINITO ATIVO"
          echo "=========================================="
          echo "IP Tailscale: ${{ steps.get-ip.outputs.ip }}"
          echo "Usuário: github-actions"
          echo "Plano de Energia: Ultimate Performance"
          echo "Hibernação: Desativada"
          echo "=========================================="

      - name: Infinite Heartbeat Loop
        shell: pwsh
        run: |
          Write-Host "Iniciando loop infinito de heartbeat..."
          
          while ($true) {
              try {
                  gh actions heartbeat
                  Write-Host "$(Get-Date): Heartbeat enviado."
              } catch {
                  Write-Warning "Falha no heartbeat."
              }
              
              Start-Sleep -Seconds 240
          }
