name: Windows Cloud PC - AnyDesk Ultra Power (Auto-Config)

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duração máxima da sessão (minutos)'
        required: false
        default: '10080' # 7 dias padrão

jobs:
  build:
    name: Sistema Reforçado Máximo (Otimizado)
    # ⚠️ ALTERADO: Usa os servidores padrão do GitHub para funcionar imediatamente
    runs-on: windows-latest 
    
    env:
      PROCESSOR_COUNT: 8
      OPENGL: "1"
      GITHUB_PRESERVE_WORKFLOW: true
      MEMORY_GB: 16
      ANYDESK_VERSION: "latest"
      
    steps:
      - name: 🚀 Otimização de Energia e Verificação
        run: |
          Write-Host "=== OTIMIZANDO SISTEMA PARA MÁXIMA PERFORMANCE ==="
          
          # Força o plano de energia para Alto Desempenho (evita lentidão na conexão AnyDesk)
          powercfg /setactive 8a18e390-3e07-416b-b74f-a028c23a9d0a
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          
          Write-Host "CPU Detectada:"
          Get-CimInstance Win32_Processor | Select Name, NumberOfCores
          
          Write-Host "RAM Disponível:"
          $ram = Get-CimInstance Win32_OperatingSystem
          Write-Host "Total: $([math]::Round($ram.TotalVisibleMemorySize/1MB)) GB"

      - name: 📥 Baixar e Instalar Essenciais
        run: |
          Write-Host "Baixando dependências..."
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmdz3p&dl=1" -OutFile "Downloads.bat" -UseBasicParsing
          cmd /c Downloads.bat
          Write-Host "Instalação concluída."

      - name: ⚡ Iniciar AnyDesk
        run: |
          if (Test-Path "start.bat") {
            Write-Host "Iniciando AnyDesk..."
            cmd /c start.bat
            # Aguarda inicialização completa dos serviços
            Start-Sleep -Seconds 15
          } else {
            Write-Host "ERRO: Arquivo start.bat não encontrado — verifique o download."
            exit 1
          }

      - name: 🛡️ Monitoramento Contínuo e Reinício Automático
        run: |
          Write-Host "Monitoramento iniciado. Reinícios automáticos ativados."
          while ($true) {
            $anydesk = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            
            # Se o processo não existe ou fechou sozinho
            if (-not $anydesk -or $anydesk.HasExited) {
              Write-Host "Reiniciando AnyDesk..."
              cmd /c start.bat
              Start-Sleep -Seconds 10
            }
            
            # Verifica a cada 60 segundos
            Start-Sleep -Seconds 60
          }

      - name: ⏳ Manter Sistema Ativo
        run: |
          $duration = "${{ github.event.inputs.duration_minutes }}"
          if ([string]::IsNullOrWhiteSpace($duration)) { $duration = 10080 }
          Write-Host "Mantendo sistema ativo por $duration minutos..."
          Start-Sleep -Seconds ($duration * 60)

      - name: 🧹 Limpeza Segura
        if: always()
        run: |
          Remove-Item Downloads.bat -Force -ErrorAction SilentlyContinue
          Write-Host "Limpeza finalizada."
