name: Windows Cloud PC - AnyDesk (Sem Download)

on:
  workflow_dispatch:
    inputs:
      anydesk_id:
        description: 'Seu ID AnyDesk Fixo (deixe vazio para gerar aleatório)'
        required: false
        default: ''

jobs:
  build:
    name: Sistema Reforçado (Daemon + Monitoramento)
    runs-on: windows-latest
    
    env:
      ANYDESK_DIR: "C:\\Program Files (x86)\\AnyDesk"
      ANYDESK_EXE: "C:\\Program Files (x86)\\AnyDesk\\AnyDesk.exe"

    steps:
      - name: 🚀 Otimização do Ambiente
        run: |
          powercfg /setactive 8a18e390-3e07-416b-b74f-a028c23a9d0a
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          Write-Host "Ambiente otimizado."

      - name: ⚡ Preparar e Iniciar Daemon
        run: |
          $anydeskExe = "${{ env.ANYDESK_EXE }}"
          $dir = "${{ env.ANYDESK_DIR }}"
          
          # 1. Verifica existência
          if (-not (Test-Path $anydeskExe)) {
              Write-Error "❌ ERRO: AnyDesk não encontrado em $anydeskExe"
              exit 1
          }

          # 2. Cria estrutura obrigatória para rodar headless
          New-Item -ItemType Directory -Force -Path "$dir\data" | Out-Null
          New-Item -ItemType File -Force -Path "$dir\user.conf" | Out-Null

          # 3. Define ID Fixo se fornecido
          if ("${{ github.event.inputs.anydesk_id }}" -ne "") {
              Write-Host "Configurando ID Fixo..."
              "id=${{ github.event.inputs.anydesk_id }}" | Out-File -FilePath "$dir\user.conf" -Encoding ascii
          } else {
              Write-Host "ID aleatório será gerado."
          }

          # 4. Mata qualquer processo órfão
          Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue | Stop-Process -Force

          # 5. Inicia via CMD para evitar bloqueios do PowerShell
          Start-Process cmd.exe -ArgumentList "/c", "`"$anydeskExe`" --daemon" -WindowStyle Hidden

          Write-Host "Aguardando inicialização completa..."
          Start-Sleep -Seconds 30

          # 6. Validação crítica
          $pid = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
          if ($pid) {
              Write-Host "✅ Daemon iniciado com sucesso (PID: $($pid.Id))"
          } else {
              Write-Error "❌ FALHA CRÍTICA: O daemon do AnyDesk morreu imediatamente após iniciar."
              exit 1
          }

      - name: 🔍 Verificar Status
        run: |
          $pid = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
          
          if ($pid) {
              Write-Host "✅ AnyDesk Daemon está RODANDO (PID: $($pid.Id))"
              
              $configFile = "${{ env.ANYDESK_DIR }}\user.conf"
              if (Test-Path $configFile) {
                  $content = Get-Content $configFile
                  if ($content -match "id=(.+)") {
                      $id = $matches[1]
                      Write-Host "🆔 Seu AnyDesk ID é: $id"
                  } else {
                      Write-Host "⚠️ ID não encontrado ainda."
                  }
              }
          } else {
              Write-Host "❌ ERRO: Processo não iniciou."
              exit 1
          }

      - name: 🛡️ Monitoramento Contínuo
        run: |
          Write-Host "=== MONITORAMENTO ATIVO ==="
          while ($true) {
              $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              $portOpen = $false
              
              if (-not $process -or $process.HasExited) {
                  Write-Host "⚠️ Reiniciando..."
                  Start-Sleep -Seconds 5
                  Start-Process "${{ env.ANYDESK_EXE }}" -ArgumentList "--daemon", "--minimized" -WindowStyle Hidden -WorkingDirectory "${{ env.ANYDESK_DIR }}"
                  Start-Sleep -Seconds 10
                  continue
              }

              try {
                  $tcpClient = New-Object System.Net.Sockets.TcpClient
                  $connect = $tcpClient.BeginConnect("127.0.0.1", 7070, $null, $null)
                  $timeout = $connect.AsyncWaitHandle.WaitOne(2000, $false)
                  if ($timeout) {
                      $portOpen = $true
                      $tcpClient.Close()
                  }
              } catch {}

              if (-not $portOpen) {
                  Write-Host "⚠️ Porta fechada. Reiniciando serviço..."
                  Stop-Process -Name "AnyDesk" -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 5
                  Start-Process "${{ env.ANYDESK_EXE }}" -ArgumentList "--daemon", "--minimized" -WindowStyle Hidden -WorkingDirectory "${{ env.ANYDESK_DIR }}"
              } else {
                  Write-Host "✅ AnyDesk saudável."
              }

              Start-Sleep -Seconds 30
          }

      - name: ⏳ Manter Ativo
        run: |
          Start-Sleep -Seconds 604800

      - name: 🧹 Limpeza Final
        if: always()
        run: |
          Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "Limpeza finalizada."
