name: Windows Cloud PC - AnyDesk Estável (Serviço)

on:
  workflow_dispatch:

jobs:
  build:
    name: Sistema Reforçado Máximo (Modo Serviço)
    runs-on: windows-latest
    
    env:
      PROCESSOR_COUNT: 8
      OPENGL: "1"
      GITHUB_PRESERVE_WORKFLOW: true
      MEMORY_GB: 16

    steps:
      - name: 🚀 Otimização de Energia
        run: |
          Write-Host "=== OTIMIZANDO SISTEMA ==="
          powercfg /setactive 8a18e390-3e07-416b-b74f-a028c23a9d0a
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0

      - name: 📥 Instalar AnyDesk via Chocolatey
        run: |
          Write-Host "Instalando AnyDesk via Chocolatey..."
          choco install anydesk -y --no-session
          Write-Host "Instalação concluída."

      - name: ⚡ Configurar e Iniciar Serviço AnyDesk
        run: |
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          
          # Verifica se o arquivo existe
          if (-not (Test-Path $anydeskPath)) {
            Write-Host "ERRO: AnyDesk não encontrado em $anydeskPath"
            exit 1
          }

          Write-Host "Iniciando serviço AnyDesk..."
          
          # Para qualquer instância antiga
          Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue | Stop-Process -Force
          
          # Inicia o AnyDesk no modo serviço/daemon para ser mais leve e estável
          Start-Process $anydeskPath -ArgumentList "--service" -WindowStyle Hidden
          
          # Aguarda o serviço registrar
          Start-Sleep -Seconds 15
          
          # Verifica se o processo está vivo
          if (Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue) {
            Write-Host "AnyDesk serviço iniciado com sucesso."
          } else {
            Write-Host "Alerta: Processo AnyDesk não encontrado. Tentando reiniciar..."
            Start-Process $anydeskPath -WindowStyle Hidden
          }

      - name: 🛡️ Monitoramento Inteligente
        run: |
          Write-Host "Monitoramento ativo..."
          while ($true) {
            $anydesk = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            
            # Se o processo morreu, reinicia
            if (-not $anydesk -or $anydesk.HasExited) {
              Write-Host "Reiniciando AnyDesk..."
              Start-Process "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" -WindowStyle Hidden
              Start-Sleep -Seconds 10
            }
            
            # Opcional: Verificar se a porta 7070 está ouvindo (porta padrão AnyDesk)
            # Isso garante que o serviço está realmente aceitando conexões
            try {
              $tcpClient = New-Object System.Net.Sockets.TcpClient
              $connect = $tcpClient.BeginConnect("127.0.0.1", 7070, $null, $null)
              $timeout = $connect.AsyncWaitHandle.WaitOne(2000, $false)
              if (!$timeout) {
                Write-Host "Porta 7070 não respondendo. Reiniciando serviço..."
                Stop-Process -Name "AnyDesk" -Force -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 5
                Start-Process "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" -WindowStyle Hidden
              } else {
                $tcpClient.Close()
              }
            } catch {
              Write-Host "Erro na verificação da porta."
            }

            Start-Sleep -Seconds 30
          }

      - name: ⏳ Manter Ativo
        run: |
          Write-Host "Mantendo sistema ativo..."
          Start-Sleep -Seconds 604800

      - name: 🧹 Limpeza
        if: always()
        run: |
          Write-Host "Limpeza finalizada."
