name: Setup Roblox RDP + Tailscale (Infinito)

on:
  workflow_dispatch: # Execute manualmente via botão na aba Actions

jobs:
  setup-roblox-rdp:
    runs-on: windows-latest
    
    # Remove o timeout padrão de 6 horas do GitHub
    timeout-minutes: 0 
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ($env:TAILSCALE_AUTH_KEY) {
            Write-Host "Autenticando com chave..."
            tailscale up --authkey=$env:TAILSCALE_AUTH_KEY --hostname="roblox-rdp-${{ github.run_number }}" --reset
          } else {
            Write-Host "Chave não encontrada. Iniciando serviço..."
            Start-Service tailscaled
            tailscale up --advertise-tags=tag:ci-runner
          }

      - name: Configure Remote Desktop & Power
        shell: pwsh
        run: |
          Write-Host "Configurando RDP e Energia..."
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Habilita Ultimate Performance se não existir
          powercfg /list | Select-String "Ultimate Performance" -Quiet | Out-Null
          if (-not $?) {
              powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb99
          }
          
          # Ativa perfil de alta performance
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /hibernate off
          
          Write-Host "RDP e Energia configurados."

      - name: Wait and Get IP
        id: get-ip
        shell: pwsh
        run: |
          Write-Host "Aguardando conexão Tailscale estabilizar..."
          $ip = $null
          $attempts = 0
          $maxAttempts = 30 
          
          while ($null -eq $ip -and $attempts -lt $maxAttempts) {
              Start-Sleep -Seconds 5
              $iface = Get-NetAdapter | Where-Object {
                  $_.Name -like "*tailscale*" -or 
                  $_.InterfaceDescription -like "*tailscale*" -or
                  $_.Name -like "*Tailnet*"
              }
              
              if ($iface) {
                  try {
                      $ipAddressObj = Get-NetIPAddress -InterfaceIndex $iface.ifIndex -AddressFamily IPv4 -ErrorAction Stop
                      if ($ipAddressObj.IPAddress -and $ipAddressObj.IPAddress -ne "0.0.0.0") {
                          $ip = $ipAddressObj.IPAddress
                      }
                  } catch {}
              }
              $attempts++
          }

          if ($null -eq $ip) {
              Write-Warning "Falha ao obter IP automático."
              exit 1
          }

          echo "IP_TAILNET=$ip" >> $env:GITHUB_ENV
          Write-Host "::set-output name=ip::$ip"
          Write-Host "IP Obtido: $ip"

      - name: Display Connection Info
        run: |
          echo "=========================================="
          echo "CONFIGURAÇÃO CONCLUÍDA - MODO INFINITO ATIVO"
          echo "=========================================="
          echo "IP Tailscale: ${{ steps.get-ip.outputs.ip }}"
          echo "Usuário: github-actions"
          echo "Plano de Energia: Ultimate Performance"
          echo "Hibernação: Desativada"
          echo "=========================================="

      - name: Infinite Heartbeat Loop
        shell: pwsh
        run: |
          Write-Host "Iniciando loop infinito de heartbeat..."
          Write-Host "Este runner manterá o job vivo indefinidamente."
          
          while ($true) {
              try {
                  gh actions heartbeat
                  Write-Host "$(Get-Date): Heartbeat enviado."
              } catch {
                  Write-Warning "Falha no heartbeat, tentando reconectar..."
              }
              
              # Espera 4 minutos (240 segundos) antes do próximo ping
              Start-Sleep -Seconds 240
          }
